# Configuracion de build para AWS Amplify Hosting.
# Amplify construye la SPA y publica el contenido de dist/.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
